<!-- Barra de Navegación Superior -->
<header style="display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: white; border-bottom: 1px solid #e0e0e0; font-family: sans-serif;">
  
  <div style="font-weight: bold; font-size: 1.5rem; color: #2c3e50;">
    MarketPoint <span style="font-size: 0.8rem; color: #7f8c8d; font-weight: normal;">Enterprise Retail Core</span>
  </div>

  <nav style="display: flex; gap: 15px;">
    
    <!-- 🟢 SIEMPRE VISIBLES (Públicos) -->
    <a routerLink="/catalogo" routerLinkActive="active-tab" 
       style="padding: 10px 15px; text-decoration: none; color: #555; border-radius: 20px; border: 1px solid transparent; font-weight: 500;">
       Catálogo
    </a>
    <a routerLink="/carrito" routerLinkActive="active-tab" 
       style="padding: 10px 15px; text-decoration: none; color: #555; border-radius: 20px; border: 1px solid transparent; font-weight: 500;">
       Mi Carrito & Checkout
    </a>

    <!-- 🟡 VISIBLE SOLO SI HAY SESIÓN -->
    <a *ngIf="authService.isLoggedIn()" routerLink="/mis-compras" routerLinkActive="active-tab" 
       style="padding: 10px 15px; text-decoration: none; color: #555; border-radius: 20px; border: 1px solid transparent; font-weight: 500;">
       Mis Compras
    </a>

    <a routerLink="/vender-con-nosotros" routerLinkActive="active-tab" 
       style="padding: 10px 15px; text-decoration: none; color: #e67e22; border-radius: 20px; border: 1px solid transparent; font-weight: bold;">
       Vender en MarketPoint
    </a>

    <!-- 🔴 SOLO VISIBLES PARA STAFF (No clientes) -->
    <ng-container *ngIf="authService.isLoggedIn() && authService.getRole() !== 'customer'">
      <a routerLink="/inventario" routerLinkActive="active-tab" 
         style="padding: 10px 15px; text-decoration: none; color: #555; border-radius: 20px; border: 1px solid transparent; font-weight: 500;">
         Inventario (Admin)
      </a>
      <a routerLink="/reportes" routerLinkActive="active-tab" 
         style="padding: 10px 15px; text-decoration: none; color: #555; border-radius: 20px; border: 1px solid transparent; font-weight: 500;">
         Reportes & Órdenes
      </a>
      
      <!-- BOTONES EXCLUSIVOS PARA SÚPER ADMIN (Restringidos por Rol) -->
      <ng-container *ngIf="authService.getRole() === 'super-admin' || authService.getRole() === 'superadmin'">
        <a routerLink="/super-admin" routerLinkActive="active-tab" 
           style="padding: 10px 15px; text-decoration: none; color: #8e44ad; border-radius: 20px; border: 1px solid transparent; font-weight: bold;">
           Súper Admin
        </a>
        <a routerLink="/admin-tenants" routerLinkActive="active-tab" 
           style="padding: 10px 15px; text-decoration: none; color: #d35400; border-radius: 20px; border: 1px solid transparent; font-weight: bold;">
           Gestión Inquilinos
        </a>
      </ng-container>
    </ng-container>

  </nav>

  <div style="display: flex; align-items: center; gap: 15px;">
    <span style="background: #e8f5e9; color: #2e7d32; padding: 5px 10px; border-radius: 4px; font-size: 0.8rem; font-weight: bold;">
      API Online + TypeORM
    </span>

    <a *ngIf="!authService.isLoggedIn()" routerLink="/login" 
       style="padding: 8px 16px; background-color: #0056b3; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 0.9rem; cursor: pointer;">
      Iniciar Sesión
    </a>

    <button *ngIf="authService.isLoggedIn()" (click)="cerrarSesion()"
            style="padding: 8px 16px; background-color: #dc3545; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 0.9rem; cursor: pointer;">
      Cerrar Sesión
    </button>
  </div>
</header>

<style>
  .active-tab {
    border-color: #3498db !important;
    color: #3498db !important;
    background: #f0f8ff;
  }
</style>

<main style="padding: 30px; background-color: #f8f9fa; min-height: 80vh;">
  <router-outlet></router-outlet>
</main>
